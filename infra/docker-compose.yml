version: '3.8'

services:

  dashboard:
    build: ../app
    container_name: parkshare_dashboard
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - sqlite_data:/app/data
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: parkshare_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - dashboard
    networks:
      - web

networks:
  web:

volumes:
  sqlite_data:
