version: '3.8'

services:

  dashboard:
    build: ../app
    container_name: parkshare_dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - sqlite_data:/app/database
    networks:
      - web

volumes:
  sqlite_data:

networks:
  web:
