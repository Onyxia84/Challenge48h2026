server {
    server_name parkshare-dashboard.duckdns.org;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/parkshare-dashboard.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkshare-dashboard.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = parkshare-dashboard.duckdns.org) {
        return 301 https://$host$request_uri;
    }
    

    listen 80;
    server_name parkshare-dashboard.duckdns.org;
    return 404;

}